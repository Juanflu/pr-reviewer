# Publica la web en GitHub Pages SIN datos: solo se despliega index.html.
# data.js (datos reales) nunca se sube al sitio; quien abre la web carga su propio CSV en el navegador.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio (solo index.html, sin data.js)
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
          test ! -e _site/data.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
