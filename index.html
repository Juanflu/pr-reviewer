<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas de PRs</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #667085;
    --border: #e3e6eb;
    --accent: #2f6fde;
    --accent-soft: #dbe6fb;
    --line: #e07a1f;
    --danger: #c2410c;
    --ok: #15803d;
    --hover: #f1f4f9;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1b1f27;
      --text: #e6e9ef;
      --muted: #98a2b3;
      --border: #2c323d;
      --accent: #6b9cf0;
      --accent-soft: #24365a;
      --line: #f0a050;
      --danger: #f08a5d;
      --ok: #4ade80;
      --hover: #232834;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }

  /* Filtros */
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 0;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; }
  button:hover { background: var(--hover); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .presets button { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .presets .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); }

  /* Gráfico */
  .chart-wrap { position: relative; }
  #chart { width: 100%; height: 280px; display: block; }
  #chart text { fill: var(--muted); font-size: 11px; }
  #chart .grid { stroke: var(--border); }
  #chart .bar { fill: var(--accent); opacity: .85; }
  #chart .bar.hl { opacity: 1; }
  #chart .ln { fill: none; stroke: var(--line); stroke-width: 2; }
  #chart .dot { fill: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .tip {
    position: absolute; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; display: none; z-index: 2;
  }

  /* Tablas */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; }
  th .arr { font-size: 10px; margin-left: 3px; }
  tbody tr:hover { background: var(--hover); }
  #groupTable tbody tr { cursor: pointer; }
  td.title { white-space: normal; min-width: 260px; max-width: 460px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--hover); }
  .pill.completed { color: var(--ok); }
  .pill.abandoned { color: var(--danger); }
  .pill.active { color: var(--accent); }
  .bar-cell { position: relative; }
  .bar-cell span { position: relative; z-index: 1; }
  .bar-cell::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
    width: var(--w, 0%); background: var(--accent-soft); border-radius: 3px;
  }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 12px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  @media (max-width: 600px) {
    main { padding-top: 16px; }
    .kpi .value { font-size: 20px; }
    #chart { height: 220px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Métricas de Pull Requests</h1>
    <div class="muted small" id="meta"></div>
  </header>

  <section class="card" aria-label="Filtros">
    <div class="filters">
      <div class="field"><label for="f-from">Desde</label><input type="date" id="f-from"></div>
      <div class="field"><label for="f-to">Hasta</label><input type="date" id="f-to"></div>
      <div class="field"><label for="f-author">Autor</label><select id="f-author"></select></div>
      <div class="field"><label for="f-status">Estado</label><select id="f-status"></select></div>
      <div class="field"><label for="f-project">Proyecto</label><select id="f-project"></select></div>
      <div class="field"><label for="f-repo">Repositorio</label><select id="f-repo"></select></div>
      <div class="field"><label for="f-branch">Rama destino</label><select id="f-branch"></select></div>
      <div class="field"><label for="f-q">Buscar en título</label><input type="search" id="f-q" placeholder="p. ej. UA-5643"></div>
    </div>
    <div class="presets">
      <span class="muted small">Periodo:</span>
      <button data-preset="30">Últimos 30 días</button>
      <button data-preset="90">3 meses</button>
      <button data-preset="180">6 meses</button>
      <button data-preset="365">Último año</button>
      <button data-preset="all">Todo</button>
      <span class="spacer"></span>
      <button id="reset">Limpiar filtros</button>
    </div>
  </section>

  <section class="kpis" id="kpis" aria-label="Indicadores"></section>

  <section class="card">
    <div class="card-head">
      <h2>Evolución</h2>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>Nº PRs</span>
        <span><i style="background:var(--line)"></i><span id="lineLabel">Mediana h en revisión</span></span>
        <div class="seg" id="gran">
          <button data-v="week">Semana</button><button data-v="month">Mes</button>
        </div>
        <div class="seg" id="lineMetric">
          <button data-v="median">Mediana</button><button data-v="mean">Media</button>
        </div>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" role="img" aria-label="Gráfico de PRs por periodo"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Agrupado</h2>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px">
        <label for="groupBy" style="margin:0">Agrupar por</label>
        <select id="groupBy">
          <option value="author">Autor</option>
          <option value="project">Proyecto</option>
          <option value="repo">Repositorio</option>
          <option value="branch">Rama destino</option>
          <option value="status">Estado</option>
          <option value="month">Mes</option>
        </select>
      </div>
    </div>
    <div class="table-wrap"><table id="groupTable"></table></div>
    <div class="note">Haz clic en una fila para filtrar por ese valor. Tiempos en horas naturales desde la creación hasta el cierre; las PRs activas cuentan en el nº de PRs pero no en los tiempos.</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Detalle de PRs</h2>
      <span class="muted small" id="detailCount"></span>
    </div>
    <div class="table-wrap"><table id="detailTable"></table></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Datos ----------
  const DATA = window.PR_DATA;
  if (!DATA || !Array.isArray(DATA.rows)) {
    document.querySelector("main").innerHTML =
      '<div class="card empty">No se encontró <code>data.js</code>. Ejecuta <code>python3 build_data.py</code> en esta carpeta.</div>';
    return;
  }
  const ROWS = DATA.rows.map(r => ({
    ...r,
    day: r.created ? r.created.slice(0, 10) : "",
    month: r.created ? r.created.slice(0, 7) : "",
    titleLC: (r.title || "").toLowerCase(),
    hasTime: r.status !== "active" && typeof r.hours === "number"
  }));
  const MAX_DAY = ROWS.reduce((m, r) => (r.day > m ? r.day : m), "");
  const MIN_DAY = ROWS.reduce((m, r) => (!m || (r.day && r.day < m) ? r.day : m), "");

  const ALL = "";
  const FILTER_KEYS = ["from", "to", "author", "status", "project", "repo", "branch", "q"];
  const DEFAULTS = { from: "", to: "", author: ALL, status: ALL, project: ALL, repo: ALL, branch: ALL, q: "",
    group: "author", gran: "month", line: "median", gs: "count", gd: "desc", ds: "created", dd: "desc", page: 1 };
  const state = { ...DEFAULTS };
  const PAGE_SIZE = 50;

  // ---------- Formato ----------
  const nf1 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  const nf0 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 0, useGrouping: "always" });
  const pct = new Intl.NumberFormat("es-ES", { style: "percent", maximumFractionDigits: 1 });
  const monthFmt = new Intl.DateTimeFormat("es-ES", { month: "short", year: "numeric", timeZone: "UTC" });
  const dayFmt = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function fmtHours(h) {
    if (h == null || isNaN(h)) return "—";
    return h > 48 ? `${nf1.format(h)} h · ${nf1.format(h / 24)} d` : `${nf1.format(h)} h`;
  }
  const fmtMonth = key => monthFmt.format(new Date(key + "-01T00:00:00Z"));
  const fmtDay = key => dayFmt.format(new Date(key + "T00:00:00Z"));

  // ---------- Estadísticas ----------
  function quantile(sorted, q) {
    if (!sorted.length) return null;
    const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
  }
  function stats(rows) {
    const hrs = rows.filter(r => r.hasTime).map(r => r.hours).sort((a, b) => a - b);
    const abandoned = rows.filter(r => r.status === "abandoned").length;
    return {
      count: rows.length,
      timed: hrs.length,
      mean: hrs.length ? hrs.reduce((s, h) => s + h, 0) / hrs.length : null,
      median: quantile(hrs, 0.5),
      p90: quantile(hrs, 0.9),
      abandonedPct: rows.length ? abandoned / rows.length : null
    };
  }

  // ---------- Filtros ----------
  const $ = id => document.getElementById(id);
  const el = { from: $("f-from"), to: $("f-to"), author: $("f-author"), status: $("f-status"),
    project: $("f-project"), repo: $("f-repo"), branch: $("f-branch"), q: $("f-q") };

  const uniq = (rows, k) => [...new Set(rows.map(r => r[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));

  function fillSelect(select, values, current, allLabel) {
    select.innerHTML = `<option value="">${allLabel}</option>` +
      values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    select.value = values.includes(current) ? current : ALL;
    return select.value;
  }

  function refreshOptions() {
    state.author = fillSelect(el.author, uniq(ROWS, "author"), state.author, "Todos");
    state.status = fillSelect(el.status, uniq(ROWS, "status"), state.status, "Todos");
    state.project = fillSelect(el.project, uniq(ROWS, "project"), state.project, "Todos");
    const repoSrc = state.project ? ROWS.filter(r => r.project === state.project) : ROWS;
    state.repo = fillSelect(el.repo, uniq(repoSrc, "repo"), state.repo, "Todos");
    const branchSrc = repoSrc.filter(r => !state.repo || r.repo === state.repo);
    state.branch = fillSelect(el.branch, uniq(branchSrc, "branch"), state.branch, "Todas");
    el.from.value = state.from; el.to.value = state.to; el.q.value = state.q;
    el.from.min = el.to.min = MIN_DAY; el.from.max = el.to.max = MAX_DAY;
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return ROWS.filter(r =>
      (!state.from || r.day >= state.from) &&
      (!state.to || r.day <= state.to) &&
      (!state.author || r.author === state.author) &&
      (!state.status || r.status === state.status) &&
      (!state.project || r.project === state.project) &&
      (!state.repo || r.repo === state.repo) &&
      (!state.branch || r.branch === state.branch) &&
      (!q || r.titleLC.includes(q) || String(r.id).includes(q))
    );
  }

  // ---------- URL (#hash) ----------
  function writeHash() {
    const p = new URLSearchParams();
    for (const k of Object.keys(DEFAULTS)) if (String(state[k]) !== String(DEFAULTS[k])) p.set(k, state[k]);
    const h = p.toString();
    history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    for (const k of Object.keys(DEFAULTS)) if (p.has(k)) state[k] = k === "page" ? Number(p.get(k)) || 1 : p.get(k);
  }

  // ---------- KPIs ----------
  function renderKpis(s) {
    const items = [
      ["PRs", nf0.format(s.count), `de ${nf0.format(ROWS.length)} en total`],
      ["Media en revisión", fmtHours(s.mean), `${nf0.format(s.timed)} PRs cerradas`],
      ["Mediana en revisión", fmtHours(s.median), "la mitad se cierra antes"],
      ["P90 en revisión", fmtHours(s.p90), "el 90% se cierra antes"],
      ["Abandonadas", s.abandonedPct == null ? "—" : pct.format(s.abandonedPct), "sobre las PRs filtradas"]
    ];
    $("kpis").innerHTML = items.map(([l, v, sub]) =>
      `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub}</div></div>`).join("");
  }

  // ---------- Gráfico ----------
  function weekKey(day) {
    const d = new Date(day + "T00:00:00Z");
    const dow = (d.getUTCDay() + 6) % 7; // lunes = 0
    d.setUTCDate(d.getUTCDate() - dow);
    return d.toISOString().slice(0, 10);
  }
  function periodKeys(from, to, gran) {
    const keys = [];
    if (!from || !to) return keys;
    if (gran === "month") {
      let [y, m] = from.slice(0, 7).split("-").map(Number);
      const end = to.slice(0, 7);
      for (;;) {
        const k = `${y}-${String(m).padStart(2, "0")}`;
        keys.push(k);
        if (k >= end) break;
        if (++m > 12) { m = 1; y++; }
      }
    } else {
      const d = new Date(weekKey(from) + "T00:00:00Z"), end = weekKey(to);
      while (d.toISOString().slice(0, 10) <= end) { keys.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 7); }
    }
    return keys;
  }

  function renderChart(rows) {
    const svg = $("chart"), tip = $("tip");
    const W = svg.clientWidth || 800, H = svg.clientHeight || 280;
    const m = { t: 12, r: 48, b: 28, l: 40 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    $("lineLabel").textContent = (state.line === "mean" ? "Media" : "Mediana") + " h en revisión";

    if (!rows.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">Sin datos para estos filtros</text>`; return; }

    const from = state.from || rows.reduce((a, r) => (r.day < a ? r.day : a), "9999");
    const to = state.to || rows.reduce((a, r) => (r.day > a ? r.day : a), "");
    const keys = periodKeys(from, to, state.gran);
    const buckets = new Map(keys.map(k => [k, []]));
    for (const r of rows) {
      const k = state.gran === "month" ? r.month : weekKey(r.day);
      if (buckets.has(k)) buckets.get(k).push(r);
    }
    const series = keys.map(k => { const s = stats(buckets.get(k)); return { k, n: s.count, v: s[state.line] }; });

    const maxN = Math.max(1, ...series.map(s => s.n));
    const maxV = Math.max(1, ...series.map(s => s.v || 0));
    const niceMax = x => { const p = Math.pow(10, Math.floor(Math.log10(x))); return Math.ceil(x / p) * p; };
    const yN = niceMax(maxN), yV = niceMax(maxV);
    const bw = iw / series.length;
    const x = i => m.l + i * bw;
    const yn = n => m.t + ih - (n / yN) * ih;
    const yv = v => m.t + ih - (v / yV) * ih;

    let out = "";
    for (let i = 0; i <= 4; i++) {
      const y = m.t + (ih * i) / 4;
      out += `<line class="grid" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/>`;
      out += `<text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${nf0.format(yN * (1 - i / 4))}</text>`;
      out += `<text x="${m.l + iw + 6}" y="${y + 4}">${nf0.format(yV * (1 - i / 4))}h</text>`;
    }
    const gap = Math.min(4, bw * 0.2);
    series.forEach((s, i) => {
      out += `<rect class="bar" data-i="${i}" x="${x(i) + gap / 2}" y="${yn(s.n)}" width="${Math.max(1, bw - gap)}" height="${m.t + ih - yn(s.n)}"/>`;
    });
    // eje X: etiquetas espaciadas
    const labelEvery = Math.max(1, Math.ceil(series.length / Math.max(1, Math.floor(iw / 70))));
    series.forEach((s, i) => {
      if (i % labelEvery) return;
      const label = state.gran === "month" ? fmtMonth(s.k) : fmtDay(s.k).replace(/ de \d{4}$/, "");
      out += `<text x="${x(i) + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(label)}</text>`;
    });
    // línea de tiempos
    let d = "", pen = false;
    series.forEach((s, i) => {
      if (s.v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i) + bw / 2},${yv(s.v)}`; pen = true;
    });
    out += `<path class="ln" d="${d}"/>`;
    if (series.length <= 60) series.forEach((s, i) => { if (s.v != null) out += `<circle class="dot" cx="${x(i) + bw / 2}" cy="${yv(s.v)}" r="2.5"/>`; });
    // capa de interacción
    out += `<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
    svg.innerHTML = out;

    const hit = svg.querySelector("#hit");
    hit.addEventListener("mousemove", e => {
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (W / rect.width);
      const i = Math.min(series.length - 1, Math.max(0, Math.floor((px - m.l) / bw)));
      const s = series[i];
      svg.querySelectorAll(".bar.hl").forEach(b => b.classList.remove("hl"));
      const bar = svg.querySelector(`.bar[data-i="${i}"]`); if (bar) bar.classList.add("hl");
      const label = state.gran === "month" ? fmtMonth(s.k) : "Semana del " + fmtDay(s.k);
      tip.innerHTML = `<b>${esc(label)}</b><br>${nf0.format(s.n)} PRs<br>${state.line === "mean" ? "Media" : "Mediana"}: ${fmtHours(s.v)}`;
      tip.style.display = "block";
      const wrap = $("chartWrap").getBoundingClientRect();
      let left = e.clientX - wrap.left + 12;
      if (left + tip.offsetWidth > wrap.width) left = e.clientX - wrap.left - tip.offsetWidth - 12;
      tip.style.left = left + "px";
      tip.style.top = (e.clientY - wrap.top - 10) + "px";
    });
    hit.addEventListener("mouseleave", () => {
      tip.style.display = "none";
      svg.querySelectorAll(".bar.hl").forEach(b => b.classList.remove("hl"));
    });
  }

  // ---------- Tablas ----------
  function th(key, label, cur, dir, num, attr) {
    const arr = cur === key ? `<span class="arr">${dir === "asc" ? "▲" : "▼"}</span>` : "";
    return `<th class="${num ? "num" : ""}" ${attr}="${key}">${label}${arr}</th>`;
  }
  function cmp(a, b, dir) {
    const na = a == null, nb = b == null;
    if (na || nb) return na === nb ? 0 : na ? 1 : -1; // vacíos al final
    const r = typeof a === "number" ? a - b : String(a).localeCompare(String(b), "es");
    return dir === "asc" ? r : -r;
  }

  function renderGroups(rows) {
    const key = state.group;
    const groups = new Map();
    for (const r of rows) { const k = r[key] || "(vacío)"; (groups.get(k) || groups.set(k, []).get(k)).push(r); }
    let list = [...groups].map(([k, rs]) => ({ k, ...stats(rs) }));
    list.sort((a, b) => cmp(a[state.gs], b[state.gs], state.gd) || cmp(a.k, b.k, "asc"));
    const maxCount = Math.max(1, ...list.map(g => g.count));
    const label = $("groupBy").selectedOptions[0].textContent;

    const head = "<thead><tr>" +
      th("k", label, state.gs, state.gd, false, "data-gs") +
      th("count", "Nº PRs", state.gs, state.gd, true, "data-gs") +
      th("mean", "Media", state.gs, state.gd, true, "data-gs") +
      th("median", "Mediana", state.gs, state.gd, true, "data-gs") +
      th("p90", "P90", state.gs, state.gd, true, "data-gs") +
      th("abandonedPct", "% abandonadas", state.gs, state.gd, true, "data-gs") +
      "</tr></thead>";
    const body = list.length ? list.map(g => `<tr data-k="${esc(g.k)}">
        <td>${esc(key === "month" ? fmtMonth(g.k) : g.k)}</td>
        <td class="num bar-cell" style="--w:${(g.count / maxCount) * 100}%"><span>${nf0.format(g.count)}</span></td>
        <td class="num">${fmtHours(g.mean)}</td>
        <td class="num">${fmtHours(g.median)}</td>
        <td class="num">${fmtHours(g.p90)}</td>
        <td class="num">${g.abandonedPct == null ? "—" : pct.format(g.abandonedPct)}</td>
      </tr>`).join("") : `<tr><td colspan="6" class="empty">Sin datos para estos filtros</td></tr>`;
    $("groupTable").innerHTML = head + "<tbody>" + body + "</tbody>";
  }

  function renderDetail(rows) {
    const list = rows.slice().sort((a, b) => {
      const k = state.ds;
      const va = k === "hours" ? (a.hours ?? null) : k === "id" ? Number(a.id) : a[k];
      const vb = k === "hours" ? (b.hours ?? null) : k === "id" ? Number(b.id) : b[k];
      return cmp(va, vb, state.dd);
    });
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    state.page = Math.min(Math.max(1, state.page), pages);
    const slice = list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);

    const h = (k, l, n) => th(k, l, state.ds, state.dd, n, "data-ds");
    const head = "<thead><tr>" + h("id", "ID", true) + h("title", "Título") + h("author", "Autor") + h("repo", "Repositorio") +
      h("branch", "Rama") + h("status", "Estado") + h("created", "Creada") + h("closed", "Cerrada") + h("hours", "En revisión", true) + "</tr></thead>";
    const body = slice.length ? slice.map(r => `<tr>
        <td class="num">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.id)}</a>` : esc(r.id)}</td>
        <td class="title">${esc(r.title)}</td>
        <td>${esc(r.author)}</td>
        <td>${esc(r.repo)}</td>
        <td>${esc(r.branch)}</td>
        <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td>
        <td>${esc((r.created || "").slice(0, 16))}</td>
        <td>${esc((r.closed || "—").slice(0, 16))}</td>
        <td class="num">${r.status === "active" ? `<span class="muted">${fmtHours(r.hours)} (abierta)</span>` : fmtHours(r.hours)}</td>
      </tr>`).join("") : `<tr><td colspan="9" class="empty">Sin PRs para estos filtros</td></tr>`;
    $("detailTable").innerHTML = head + "<tbody>" + body + "</tbody>";
    $("detailCount").textContent = `${nf0.format(list.length)} PRs`;
    $("pager").innerHTML = pages > 1
      ? `<button data-p="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹ Anterior</button>
         <span>Página ${state.page} de ${pages}</span>
         <button data-p="${state.page + 1}" ${state.page === pages ? "disabled" : ""}>Siguiente ›</button>`
      : "";
  }

  // ---------- Render ----------
  let lastRows = [];
  function render() {
    refreshOptions();
    $("groupBy").value = state.group;
    document.querySelectorAll("#gran button").forEach(b => b.classList.toggle("on", b.dataset.v === state.gran));
    document.querySelectorAll("#lineMetric button").forEach(b => b.classList.toggle("on", b.dataset.v === state.line));
    lastRows = filtered();
    renderKpis(stats(lastRows));
    renderChart(lastRows);
    renderGroups(lastRows);
    renderDetail(lastRows);
    writeHash();
  }

  // ---------- Eventos ----------
  for (const k of FILTER_KEYS) {
    const evt = k === "q" ? "input" : "change";
    el[k].addEventListener(evt, () => { state[k] = el[k].value; state.page = 1; render(); });
  }
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.preset;
    if (p === "all") { state.from = ""; state.to = ""; }
    else {
      const d = new Date(MAX_DAY + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() - Number(p) + 1);
      state.from = d.toISOString().slice(0, 10); state.to = MAX_DAY;
    }
    state.page = 1; render();
  }));
  $("reset").addEventListener("click", () => {
    for (const k of FILTER_KEYS) state[k] = DEFAULTS[k];
    state.page = 1; render();
  });
  $("groupBy").addEventListener("change", e => { state.group = e.target.value; state.gs = "count"; state.gd = "desc"; render(); });
  $("gran").addEventListener("click", e => { if (e.target.dataset.v) { state.gran = e.target.dataset.v; render(); } });
  $("lineMetric").addEventListener("click", e => { if (e.target.dataset.v) { state.line = e.target.dataset.v; render(); } });

  $("groupTable").addEventListener("click", e => {
    const h = e.target.closest("th[data-gs]");
    if (h) {
      const k = h.dataset.gs;
      state.gd = state.gs === k ? (state.gd === "asc" ? "desc" : "asc") : (k === "k" ? "asc" : "desc");
      state.gs = k; render(); return;
    }
    const tr = e.target.closest("tr[data-k]");
    if (!tr) return;
    const v = tr.dataset.k;
    if (state.group === "month") {
      const [y, m] = v.split("-").map(Number);
      state.from = `${v}-01`;
      state.to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
    } else {
      state[state.group] = v === "(vacío)" ? ALL : v;
      if (state.group === "repo") {
        const r = ROWS.find(x => x.repo === v); if (r) state.project = r.project;
      }
    }
    state.page = 1; render();
  });
  $("detailTable").addEventListener("click", e => {
    const h = e.target.closest("th[data-ds]");
    if (!h) return;
    const k = h.dataset.ds;
    state.dd = state.ds === k ? (state.dd === "asc" ? "desc" : "asc") : (["title", "author", "repo", "branch", "status"].includes(k) ? "asc" : "desc");
    state.ds = k; render();
  });
  $("pager").addEventListener("click", e => {
    const p = e.target.closest("button[data-p]");
    if (p && !p.disabled) { state.page = Number(p.dataset.p); render(); $("detailTable").scrollIntoView({ block: "nearest" }); }
  });
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => renderChart(lastRows), 120); });
  window.addEventListener("hashchange", () => { Object.assign(state, DEFAULTS); readHash(); render(); });

  // ---------- Inicio ----------
  $("meta").textContent = `${nf0.format(ROWS.length)} PRs · ${fmtDay(MIN_DAY)} – ${fmtDay(MAX_DAY)} · datos generados ${DATA.generatedAt}`;
  readHash();
  render();
})();
</script>
</body>
</html>
